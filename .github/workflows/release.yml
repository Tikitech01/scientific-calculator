name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output ScientificCalculator \
            target/aarch64-apple-darwin/release/scientific-calculator \
            target/x86_64-apple-darwin/release/scientific-calculator
      - name: Assemble the app and disk image
        env:
          # Optional. With these repository secrets set, the app is signed with a Developer ID
          # and notarised by Apple, so users can open it without the "unidentified developer" warning.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          APP="Scientific Calculator.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ScientificCalculator "$APP/Contents/MacOS/ScientificCalculator"
          cp packaging/Info.plist "$APP/Contents/Info.plist"
          ICONSET="$(mktemp -d)/AppIcon.iconset"; mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size packaging/icon.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) packaging/icon.png --out "$ICONSET/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          DMG="dist/Scientific-Calculator-$VERSION-macOS.dmg"
          mkdir -p dist dmg
          if [ -n "$MACOS_CERT_P12" ]; then
            KC="$RUNNER_TEMP/build.keychain"
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p ci "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p ci "$KC"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
            security list-keychains -d user -s "$KC"
            IDENTITY=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Scientific Calculator" -srcfolder dmg -ov -format UDZO "$DMG"
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$APPLE_ID" ]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$DMG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --release
      - name: Package (.deb and .tar.gz)
        run: bash packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Scientific Calculator ${{ steps.v.outputs.tag }}
          files: out/*
          generate_release_notes: true
