name: Windows MSI build

on:
  push:
    branches: [main, signpath-prep-3.1.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable and MSI
        shell: pwsh
        run: ./build-msi.ps1 -Build
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-calculator-windows-msi
          path: dist/*.msi
          if-no-files-found: error
