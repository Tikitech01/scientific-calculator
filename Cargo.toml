[package]
name = "numera"
version = "1.3.0"
edition = "2021"
description = "A clean, minimal scientific and graphing calculator"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
num-complex = "0.4"
libm = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
